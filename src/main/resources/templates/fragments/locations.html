<!DOCTYPE html>
<html th:fragment="layout(title, links, scripts)" lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <link th:replace="${links}" rel="stylesheet" type="text/css" href="../css/StylesInvertedTable.css"/>
    <title th:text="#{data.locations}" th:replace="${title}"></title>
    <script th:replace="${scripts}"></script>
</head>
<body>
<div th:fragment="mainDivLocations(locations)" id="mainDivLocations">
    <table>
        <caption th:text="#{data.locations}"></caption>
        <tr>
            <th></th>
            <th th:text="#{data.city}"></th>
            <th th:text="#{data.state}"></th>
            <th th:text="#{data.continent}"></th>
            <th></th>
        </tr>
        <tr th:each="iterLocation: ${locations}">

            <td><img th:alt="${iterLocation.city}" th:src="@{${iterLocation.imagePath}}"/></td>
            <td th:text="${iterLocation.city}"></td>
            <td th:text="${iterLocation.state}"></td>
            <td th:text="${iterLocation.continent}"></td>
            <td></td>
        </tr>

        <tr>
            <div th:fragment="formDivLocations" id="formDivLocations">
                <form method="post" action="locations" enctype="multipart/form-data">
                    <td><input type="file" accept="image/*" name="imageFile"/></td>
                    <td><input type="text" name="city" required/></td>
                    <td><input type="text" name="state" required/></td>
                    <td><input type="text" name="continent" required/></td>
                    <td><input type="submit" th:value="#{action.saveLocation}"/></td>
                </form>
            </div>
        </tr>
    </table>
    <p class="greska" th:text="${errorMessage}"></p>
</div>
</body>
</html>
