<!DOCTYPE html>
<html th:fragment="layout(title, links, scripts)" lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
<!--    <link th:replace="${links}" rel="stylesheet" type="text/css" href="../css/StylesInvertedTable.css"/>-->
<!--    <title th:replace="${title}">Discounts</title>-->
<!--    <script th:replace="${scripts}"></script>-->
    <link rel="stylesheet" type="text/css" href="../css/StylesInvertedTable.css"/>
    <title th:text="#{data.discounts}"></title>
</head>
<body>
<div th:fragment="mainDivAirports(allLocations)" id="mainDivAirports">
    <table>
        <caption th:text="#{data.airports}"></caption>
        <tr>
            <th th:text="#{data.airportCodeName}"></th>
            <th th:text="#{data.location}"></th>
            <th></th>
        </tr>
        <tr th:each="iterAirport: ${airports}">

            <td th:text="${iterAirport.airportCodeName}"></td>
            <td th:text="|${iterAirport.location.city}, ${iterAirport.location.state}, ${iterAirport.location.continent}|"></td>
            <td></td>
        </tr>

        <tr>
            <form method="post" action="airports">
                <td><input type="text" minlength="3" maxlength="3" name="codeName" required/></td>
                <td>
                    <select name="locationId" required>
                        <option value="" onclick="" disabled th:text="#{action.defineLocation}"></option>
                        <option th:each="iterLocation: ${allLocations}" th:value="${iterLocation.id}" th:text="|${iterLocation.city}, ${iterLocation.state}, ${iterLocation.continent}|"></option>
                    </select>
<!--                    <p th:if="${#lists.isEmpty(allLocations)}">"allLocations isEmpty.</p>-->
                </td>
                <td><input type="submit" th:value="#{action.saveAirport}"/></td>
            </form>
        </tr>
    </table>
<!--    <div th:replace="~{fragments/locations.html :: mainDivLocations(~{::allLocations})}"></div>-->
    <div th:replace="~{fragments/locations.html :: mainDivLocations(${allLocations})}"></div>

    <p class="greska" th:text="${errorMessage}"></p>
</div>
</body>
</html>
