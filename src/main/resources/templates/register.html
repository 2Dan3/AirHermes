<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" type="text/css" href="../css/StiloviForma.css"/>
    <title>Register</title>
</head>
<body>
<div th:fragment="centralniDiv">
    <form method="post" action="register">
        <table class="forma">
            <caption>Register</caption>
            <tr><th>Name:</th><td><input type="text" name="name"/></td></tr>
            <tr><th>Last name:</th><td><input type="text" name="surname"/></td></tr>
            <tr><th>Username:</th><td><input type="text" name="username"/></td></tr>
            <tr><th>Email:</th><td><input type="email" name="email"/></td></tr>
            <tr><th>Password:</th><td><input type="password" name="password"/></td></tr>
            <tr><th>Repeated password:</th><td><input type="password" name="repeatedPassword"/></td></tr>
            <tr><th>Date of birth:</th><td><input type="datetime-local" name="dateOfBirth"/></td></tr>

            <tr><th></th><td><input type="submit" value="Sign up!"/></td></tr>
        </table>
    </form>
    <p class="greska" th:text="${poruka}"></p>
    <ul><li><a href="login">To login page</a></li></ul>
</div>
</body>
</html>
