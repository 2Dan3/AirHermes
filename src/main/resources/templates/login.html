<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" type="text/css" href="../css/StiloviForma.css"/>
    <title>Login</title>
</head>
<body>
<div th:fragment="centralniDiv">
    <form method="post" action="login">
        <table class="forma">
            <caption>Login</caption>
            <tr><th>Username:</th><td><input type="text" name="username"/></td></tr>
            <tr><th>Password:</th><td><input type="password" name="password"/></td></tr>
            <tr><th></th><td><input type="submit" value="Sign in!"/></td></tr>
        </table>
    </form>
    <p class="greska" th:text="${poruka}"></p>
    <ul><li><a href="register">To registration page</a></li></ul>
</div>
</body>
</html>
